
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Интерактив флуда</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1f1f1f, #3a3a3a);
        color: white;
    }

    header {
        text-align: center;
        padding: 20px;
        font-size: 28px;
        font-weight: bold;
        background: #111;
    }

    .container {
        padding: 20px;
    }

    .section {
        margin-bottom: 30px;
    }

    .section h2 {
        margin-bottom: 15px;
        border-left: 5px solid #6c63ff;
        padding-left: 10px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
    }

    .card {
        background: #2a2a2a;
        padding: 15px;
        border-radius: 12px;
        transition: 0.3s;
        cursor: pointer;
        text-align: center;
    }

    .card:hover {
        transform: scale(1.05);
        background: #3b3b3b;
    }

    button {
        margin-top: 10px;
        padding: 8px 12px;
        border: none;
        border-radius: 8px;
        background: #6c63ff;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #5548d9;
    }
</style>
</head>

<body>

<header>Список игр</header>

<div class="container">

    <div class="section">
        <h2>Игры флуда</h2>
        <div class="cards">
            <div class="card">Жених и невеста</div>
            <div class="card">Я никогда не...</div>
            <div class="card">Он 10/10, но...</div>
            <div class="card">Поле чудес</div>
            <div class="card">Твоя идея</div>
        </div>
    </div>

    <div class="section">
        <h2>Игры с ботами</h2>
        <div class="cards">
            <div class="card" onclick="showInfo('Игроки делятся на мирных и мафию. Нужно вычислить мафию или остаться незамеченным.')">
                Мафия
            </div>

            <div class="card" onclick="showInfo('Игроки получают роли и характеристики, после чего решают, кто попадёт в бункер и выживет, а кого выкинут.')">
                Бункер
            </div>
        </div>
    </div>

    <div class="section">
        <h2>Игры вне флуда</h2>
        <div class="cards">
            <div class="card" onclick="showInfo('Ваша задача рисовать на определённые темы, которые задают игроки или сама игра.')">
                Глухой телефон
            </div>

            <div class="card">Геншин</div>
            <div class="card">Пони Таун</div>
            <div class="card">Роблокс</div>
            <div class="card">Майнкрафт</div>
        </div>
    </div>

    <button onclick="window.open('https://t.me/aksusi', '_blank')">
    Есть предложения?
</button>

</div>

<script>
function showInfo(text) {
    alert(text);
}
</script>

</body>
</html>
